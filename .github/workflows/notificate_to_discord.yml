name: Discord Notification on New Tag

on:
  push:
    tags:
      - '*'          # all tags, or 'v*' for version tags

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord message
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK_URL }}
          MSG: ${{ github.event.head_commit.message }}
        run: |
          jq -n --arg msg "$MSG" '{
            embeds: [{
              title: "New tag in \($repo)",
              description: ("```" + $msg + "```"),
              color: 3447003,
              fields: [
                {name: "Tag", value: $tag, inline: true},
                {name: "Author", value: $author, inline: true},
                {name: "Commit", value: ("[" + $sha + "](" + $url + ")"), inline: true},
                {name: "What'\''s new", value: $msg, inline: false}
              ],
              timestamp: $timestamp,
              footer: {text: "GitHub Actions"}
            }]
          }' \
          --arg repo "${{ github.repository }}" \
          --arg tag  "${{ github.ref_name }}" \
          --arg author "${{ github.actor }}" \
          --arg sha   "${{ github.sha }}" \
          --arg url   "https://github.com/${{ github.repository }}/commit/${{ github.sha }}" \
          --arg timestamp "${{ github.event.head_commit.timestamp }}" \
          | curl -H "Content-Type: application/json" -d @- "$DISCORD_WEBHOOK"
